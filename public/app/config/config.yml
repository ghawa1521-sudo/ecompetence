imports:
    - { resource: parameters.yml }
    - { resource: security.yml }
    - { resource: services.yml }
    - { resource: "@gbaneBundle/Resources/config/services.yml" }

# Put parameters here that don't need to change on each machine where the app is deployed
# http://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    locale: fr

framework:
    #esi:             ~
    translator:      { fallbacks: ["%locale%"] }
    secret:          "%secret%"
    router:
        resource: "%kernel.root_dir%/config/routing.yml"
        strict_requirements: ~
    form:            ~
    csrf_protection: ~
    validation:      { enable_annotations: true }
    #serializer:      { enable_annotations: true }
    templating:
        engines: ['twig']
        #assets_version: SomeVersionScheme
    default_locale:  "%locale%"
    trusted_hosts:   ~
    trusted_proxies: ~
    session:
        # handler_id set to null will use default session handler from php.ini
        # handler_id:  ~
        cookie_lifetime: 7200
    fragments:       ~
    http_method_override: true

# Twig Configuration
twig:
    debug:            "%kernel.debug%"
    strict_variables: "%kernel.debug%"
    form:
         resources: ['bootstrap_3_layout.html.twig']
    globals:
        fonctionbase: "@ediligence.fonctiondebase"
    date:
        timezone: UTC

# Assetic Configuration
assetic:
    debug:          "%kernel.debug%"
    use_controller: false
    bundles:        [ ]
    #java: /usr/bin/java
    filters:
        cssrewrite: ~
        #closure:
        #    jar: "%kernel.root_dir%/Resources/java/compiler.jar"
        #yui_css:
        #    jar: "%kernel.root_dir%/Resources/java/yuicompressor-2.4.7.jar"

# Doctrine Configuration
doctrine:
    dbal:
        driver:   pdo_mysql
        host:     "%database_host%"
        port:     "%database_port%"
        dbname:   "%database_name%"
        user:     "%database_user%"
        password: "%database_password%"
        charset:  UTF8
        
    


        # if using pdo_sqlite as your database driver:
        #   1. add the path in parameters.yml
        #     e.g. database_path: "%kernel.root_dir%/data/data.db3"
        #   2. Uncomment database_path in parameters.yml.dist
        #   3. Uncomment next line:
        #     path:     "%database_path%"

    orm:
        auto_generate_proxy_classes: false
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        dql:
            string_functions:
                MONTH: DoctrineExtensions\Query\Mysql\Month
                YEAR:  DoctrineExtensions\Query\Mysql\Year
                DATEDIFF: DoctrineExtensions\Query\Mysql\DateDiff
                CONCAT_WS: DoctrineExtensions\Query\Mysql\ConcatWs
                TIMESTAMPDIFF: DoctrineExtensions\Query\Mysql\TimestampDiff
                LEFT:  Ediligence\EdiligenceBundle\DoctrineExtensions\Left
                RIGHT:  Ediligence\EdiligenceBundle\DoctrineExtensions\Right
                IFNULL:  DoctrineExtensions\Query\Mysql\IfNull



# Swiftmailer Configuration
swiftmailer:
    transport: "%mailer_transport%"
    host:      "%mailer_host%"
    username:  "%mailer_user%"
    password:  "%mailer_password%"
    spool:     { type: memory }
    encryption: ~
    auth_mode: ~
    port:      1025

# app/config/config.yml
fos_user:
    db_driver: orm
    firewall_name: main
    user_class: Users\UsersBundle\Entity\Users
    from_email:
        address:        dge@dge.gouv.ci
        sender_name:    SRHMG ADMIN DGE
    registration:
        confirmation:
            enabled: true

vich_uploader:
    db_driver: orm
    mappings:

            agent_cv:
                uri_prefix:         /images/cv
                upload_destination: %kernel.root_dir%/../web/images/cv
                namer:              vich_uploader.namer_uniqid #namer_origname
                inject_on_load:     false
                delete_on_update:   true
                delete_on_remove:   true
            conge_objet:
                uri_prefix:         /objetConge
                upload_destination: %kernel.root_dir%/../web/objetConge
                namer:              vich_uploader.namer_uniqid
                inject_on_load:     false
                delete_on_update:   true
                delete_on_remove:   true
            agent_image:
                uri_prefix:         /images/photo
                upload_destination: %kernel.root_dir%/../web/images/photo
                namer:              vich_uploader.namer_uniqid
                inject_on_load:     false
                delete_on_update:   true
                delete_on_remove:   true
            agent_doc:
                uri_prefix:         /images/document
                upload_destination: %kernel.root_dir%/../web/images/document
                namer:              vich_uploader.namer_uniqid
                inject_on_load:     true
                delete_on_update:   true
                delete_on_remove:   true


services:
  twig.audit.extension:
    class: Users\UsersBundle\Twig\AuditExtension
    tags:
      - { name: twig.extension }
  twig.extension.date:
    class: Twig_Extensions_Extension_Date
    tags:
    - { name: twig.extension }
  fos_user.doctrine_registry:
        alias: doctrine

        

av_alertify:
    contexts:
        front:
            engine: "toastr"              #Could be noty, modal, toastr, alert or your own
            layout: "top-left"           #Is relative according to the selected engine
            translationDomain: "messages" #Where do you want to store the translation strings
        admin:
            engine: "myOwnSystem"
            layout: "bottomRight"
            translationDomain: "messages"

core23_dompdf:
    defaults:
        dpi: 150
        defaultPaperSize: A4

knp_snappy:
    pdf:
        enabled:    true
        binary:     /usr/bin/wkhtmltopdf
        options:
            page-size: A4
            # Recommended to set UTF-8 as default encoding :)
            encoding: UTF-8
    image:
        enabled:    true
        binary:     /usr/bin/wkhtmltopdf
        options:    []

