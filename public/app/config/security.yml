# app/config/security.yml
security:
    encoders:
        FOS\UserBundle\Model\UserInterface: bcrypt

    role_hierarchy:
        ROLE_ADMIN:       ROLE_AGENT
        ROLE_FORMATEUR:   ROLE_AGENT
        ROLE_SECRETAIRE:  ROLE_AGENT
        ROLE_RESPO:       ROLE_ADMIN
        ROLE_RESPO_SRHMG: ROLE_RESPO
        ROLE_SUPER_ADMIN: ROLE_RESPO_SRHMG

    providers:
        fos_userbundle:
            id: fos_user.user_provider.username

    firewalls:
                # disables authentication for assets and the profiler, adapt it according to your needs
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            pattern: ^/
            form_login:
                provider: fos_userbundle
                csrf_provider: security.csrf.token_manager
                # if you are using Symfony < 2.8, use the following config instead:
                # csrf_provider: form.csrf_provider

            logout:       true
            anonymous:    true
            switch_user:
                provider:             ~
                parameter:            _interim_user
                role:                 ROLE_ALLOWED_TO_SWITCH

    access_control:
        # The homepage reads the authenticated user's Agent profile.
        # Send anonymous visitors to the FOSUserBundle login form instead.
        - { path: ^/$, role: ROLE_AGENT }
