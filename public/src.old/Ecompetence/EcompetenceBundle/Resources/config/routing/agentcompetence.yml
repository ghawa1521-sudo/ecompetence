y:
    path:     /
    defaults: { _controller: "EcompetenceBundle:Agentcompetence:index" }

y_show:
    path:     /{id}/show
    defaults: { _controller: "EcompetenceBundle:Agentcompetence:show" }

y_new:
    path:     /new
    defaults: { _controller: "EcompetenceBundle:Agentcompetence:new" }

y_create:
    path:     /create
    defaults: { _controller: "EcompetenceBundle:Agentcompetence:create" }
    methods:  POST

y_edit:
    path:     /{id}/edit
    defaults: { _controller: "EcompetenceBundle:Agentcompetence:edit" }

y_update:
    path:     /{id}/update
    defaults: { _controller: "EcompetenceBundle:Agentcompetence:update" }
    methods:  [POST, PUT]

y_delete:
    path:     /{id}/delete
    defaults: { _controller: "EcompetenceBundle:Agentcompetence:delete" }
    methods:  [POST, DELETE]
