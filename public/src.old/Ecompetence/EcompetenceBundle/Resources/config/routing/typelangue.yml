typelangue:
    path:     /
    defaults: { _controller: "EcompetenceBundle:TypeLangue:index" }

typelangue_show:
    path:     /{id}/show
    defaults: { _controller: "EcompetenceBundle:TypeLangue:show" }

typelangue_new:
    path:     /new
    defaults: { _controller: "EcompetenceBundle:TypeLangue:new" }

typelangue_create:
    path:     /create
    defaults: { _controller: "EcompetenceBundle:TypeLangue:create" }
    methods:  POST

typelangue_edit:
    path:     /{id}/edit
    defaults: { _controller: "EcompetenceBundle:TypeLangue:edit" }

typelangue_update:
    path:     /{id}/update
    defaults: { _controller: "EcompetenceBundle:TypeLangue:update" }
    methods:  [POST, PUT]

typelangue_delete:
    path:     /{id}/delete
    defaults: { _controller: "EcompetenceBundle:TypeLangue:delete" }
   
