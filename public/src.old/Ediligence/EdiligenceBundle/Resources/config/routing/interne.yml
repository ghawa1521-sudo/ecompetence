interne:
    path:     /
    defaults: { _controller: "EdiligenceBundle:Interne:index" }
    
interne_create:
    path:     /create
    defaults: { _controller: "EdiligenceBundle:Interne:create" }
    methods:  POST
    
interne_imput:
    path:     /{id}/imput
    defaults: { _controller: "EdiligenceBundle:Interne:imput" }
    methods:  [POST, GET]

interne_list:
    path:     /list
    defaults: { _controller: "EdiligenceBundle:Interne:list" }

interne_dilig:
    path:     /dilig
    defaults: { _controller: "EdiligenceBundle:Interne:dilig" }
    
interne_del:
    path:     /{id}/del
    defaults: { _controller: "EdiligenceBundle:Interne:del" }
    methods:  GET

interne_traiter:
    path:     /{id}/traiter
    defaults: { _controller: "EdiligenceBundle:Interne:traiter" }
    methods:  [POST, GET]