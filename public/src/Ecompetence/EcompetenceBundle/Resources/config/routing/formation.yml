formation_index:
    path:     /
    defaults: { _controller: "EcompetenceBundle:Formation:new" }
    
formation_new:
    path:     /{id}/new
    defaults: { _controller: "EcompetenceBundle:Formation:new" }

formation_valider:
    path:     /{id}/valider
    defaults: { _controller: "EcompetenceBundle:Formation:valider" }

formation_refuser:
    path:     /{id}/refuser
    defaults: { _controller: "EcompetenceBundle:Formation:refuser" }

