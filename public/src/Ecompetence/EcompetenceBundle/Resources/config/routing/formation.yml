    options:
      expose: true

listeoption:
    path:     /{id}/listeoption
    defaults: { _controller: "EcompetenceBundle:Formation:listeoption" }
    methods:  GET
    options:
      expose: true
      
formation_liste:
    path:      /{id}/liste
    defaults: { _controller: "EcompetenceBundle:Formation:liste" }

ajout_diplome:
    path:     /ajoutdiplome
    defaults: { _controller: "EcompetenceBundle:Formation:ajoutdiplome" }
