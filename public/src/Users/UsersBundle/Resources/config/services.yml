services:
      login_listener:
          class: 'Users\UsersBundle\EventListener\LoginListener'
          arguments: ['@security.context', '@router', '@event_dispatcher','@login_services','@service_container']
          tags:
              - { name: 'kernel.event_listener', event: 'security.interactive_login', method: onSecurityInteractiveLogin }
              - { name: kernel.event_listener, event: security.interactive_login, method: onAuthenticationSuccess }
              - { name: kernel.event_listener, event: kernel.controller, method: onKernelController }
      login_services:
        class: 'Users\UsersBundle\Services\LoginServices'
        arguments: [ '@doctrine.orm.default_entity_manager', '@request_stack','@security.context']
      interim.switch_user_subscriber:
        class: Users\UsersBundle\EventListener\SwitchUserSubscriber
        arguments: ["@security.token_storage","@doctrine.orm.default_entity_manager"]
        tags:
                - { name: kernel.event_subscriber }